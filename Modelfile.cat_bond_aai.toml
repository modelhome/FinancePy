# Catastrophe-bond pricing variant of the FinancePy runner — AAI-only path.
#
# Given an Average Annual Insured Loss (AAI) from OasisLMF and a Total
# Insured Value (TIV, or Total Exposed Value as a fallback), derive an
# expected-loss yield spread:  el_rate = AAI / TIV  →  YTM = risk_free + el_rate.
# Then price the bond using the runner's polymorphic implementation.
#
# This variant ignores hurricane frequency: it inherits CLIMADA's implicit
# event frequency through OasisLMF's AAI. Use Modelfile.cat_bond_aai_freq.toml
# when you have a separately-modelled landfall rate to rescale by.

name = "Cat Bond Pricer (AAI)"
description = "Prices a 10-year fixed-coupon catastrophe bond from an Average Annual Insured Loss: derives an expected-loss yield spread (AAI / TIV) over a risk-free baseline and prices with FinancePy. Uses the hazard model's implicit event frequency. Pair with Insured Loss Layer (OasisLMF)."

run = "docker run --rm -v \"$PWD/run:/run\" ${IMAGE} ${ARGS} > run/bond_metrics.output.json"
image = "domokane/financepy:latest"
args = ["{input:damage_estimates}"]

[runner]
entrypoint = "runner.py"
language = "python"

[build]
dockerfile = "Dockerfile"

[resources]
memory = "4Gi"
cpu = "2"

[[inputs]]
name = "damage_estimates"
description = "Insurance loss distribution after OasisLMF FM: AAI, EP curve, per-event insured losses."

[inputs.schema]
type = "object"
# The AAI pricing path needs an expected annual loss AND an insured value to
# divide by (el_rate = AAI / TIV), so both are required. The runner also accepts
# total_exposed_value_usd as a fallback when total_insured_value_usd is absent
# mid-pipeline, but we require the insured value here so the standalone / example
# input is complete and actually prices. The `default`s seed the auto-generated
# "Example to paste" with realistic, runnable values.
required = ["insured_aai_usd", "total_insured_value_usd"]
properties.insured_aai_usd.type = "number"
properties.insured_aai_usd.description = "Average Annual Insured Loss (expected annual loss) in USD"
properties.insured_aai_usd.default = 500000000
properties.total_insured_value_usd.type = "number"
properties.total_insured_value_usd.description = "Total Insured Value (TIV) in USD; the loss is divided by this to derive the expected-loss yield spread"
properties.total_insured_value_usd.default = 200000000000

[[outputs]]
name = "bond_metrics"

[outputs.schema]
type = "object"
required = ["clean_price", "dirty_price", "accrued_interest", "macauley_duration", "modified_duration", "convexity", "ytm"]
properties.clean_price.type = "number"
properties.dirty_price.type = "number"
properties.accrued_interest.type = "number"
properties.macauley_duration.type = "number"
properties.modified_duration.type = "number"
properties.convexity.type = "number"
properties.ytm.type = "number"
