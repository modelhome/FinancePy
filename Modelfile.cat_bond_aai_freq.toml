# Catastrophe-bond pricing variant of the FinancePy runner — AAI + frequency.
#
# Same as Modelfile.cat_bond_aai.toml, but rescales OasisLMF's AAI by a
# separately-modelled annual landfall rate before deriving the yield:
#
#   lambda_implicit = sum(per-event freq in event_insured_loss_table)
#   AAI_rescaled    = AAI * (lambda_annual / lambda_implicit)
#   el_rate         = AAI_rescaled / TIV
#   YTM             = risk_free + el_rate
#
# Use this variant when the bond's contractual peril/region doesn't match
# CLIMADA's modelled set and a historical-data Poisson fit (e.g. from
# hurricane-frequency on HURDAT2) is more appropriate for event count.

name = "Cat Bond Pricer (AAI + Frequency)"
description = "Prices a catastrophe bond from an insured AAI rescaled by a separately-modelled annual event rate — AAI × (lambda_annual / Σ per-event frequency) — before deriving the yield. Use when the bond's contractual peril/region doesn't match the hazard model's implicit frequency. Pair with Insured Loss Layer + Hurricane Landfall Rate."

run = "docker run --rm -v \"$PWD/run:/run\" ${IMAGE} ${ARGS} > run/bond_metrics.output.json"
image = "domokane/financepy:latest"
args = ["{input:damage_estimates}", "{input:hurricane_frequency}"]

[runner]
entrypoint = "runner.py"
language = "python"

[build]
dockerfile = "Dockerfile"

[resources]
memory = "4Gi"
cpu = "2"

[[inputs]]
name = "damage_estimates"
description = "Insurance loss distribution after OasisLMF FM, including the per-event insured loss table needed to compute the implicit annual rate."

[inputs.schema]
type = "object"
# Like cat_bond_aai, the pricing divides the loss by a total insured value, so
# total_insured_value_usd is required. event_insured_loss_table is also required
# (unlike cat_bond_aai) because the rescaling needs each event's frequency to
# derive lambda_implicit. The `default`s seed a realistic, runnable
# "Example to paste".
required = ["insured_aai_usd", "total_insured_value_usd", "event_insured_loss_table"]
properties.insured_aai_usd.type = "number"
properties.insured_aai_usd.description = "Average Annual Insured Loss (expected annual loss) in USD"
properties.insured_aai_usd.default = 500000000
properties.total_insured_value_usd.type = "number"
properties.total_insured_value_usd.description = "Total Insured Value (TIV) in USD; the loss is divided by this to derive the yield spread"
properties.total_insured_value_usd.default = 200000000000
properties.event_insured_loss_table.type = "array"
properties.event_insured_loss_table.description = "Per-event insured losses with annual frequency; the frequencies sum to the hazard model's implicit annual rate, which is rescaled to lambda_annual"
properties.event_insured_loss_table.items.type = "object"
properties.event_insured_loss_table.items.required = ["insured_loss_usd", "frequency"]
properties.event_insured_loss_table.items.properties.insured_loss_usd.type = "number"
properties.event_insured_loss_table.items.properties.insured_loss_usd.default = 5000000000
properties.event_insured_loss_table.items.properties.frequency.type = "number"
properties.event_insured_loss_table.items.properties.frequency.default = 0.04

[[inputs]]
name = "hurricane_frequency"
description = "Independently-modelled annual landfall rate (e.g. from hurricane-frequency / HURDAT2)."

[inputs.schema]
type = "object"
required = ["lambda_annual"]
properties.lambda_annual.type = "number"
properties.lambda_annual.description = "Independently-modelled annual landfall rate (events per year)"
properties.lambda_annual.default = 0.05

[[outputs]]
name = "bond_metrics"

[outputs.schema]
type = "object"
required = ["clean_price", "dirty_price", "accrued_interest", "macauley_duration", "modified_duration", "convexity", "ytm"]
properties.clean_price.type = "number"
properties.dirty_price.type = "number"
properties.accrued_interest.type = "number"
properties.macauley_duration.type = "number"
properties.modified_duration.type = "number"
properties.convexity.type = "number"
properties.ytm.type = "number"
