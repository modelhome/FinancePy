# Climate-adjusted bond pricing variant of the FinancePy runner.
#
# This Modelfile is one of three purpose-specific variants in this bundle.
# All three reuse the same Dockerfile + runner.py (the polymorphic
# implementation in runner.py); they differ only in declared inputs +
# required schema, which lets the Model Home catalog present each use case
# as a separate Model with an honest IO contract.
#
# Climate bond use:  given a climate risk premium (e.g. from DicePy) and
# default bond parameters baked into the runner, price a 10-year fixed-coupon
# bond. The runner's _mean_nested helper collapses DicePy's
# {scenario: {config: float}} dict into one representative scalar YTM.
#
# See Modelfile.cat_bond_aai.toml and Modelfile.cat_bond_aai_freq.toml for
# the catastrophe-bond variants.

name = "Climate Bond Pricer"
description = "Prices a 10-year fixed-coupon bond by treating an upstream climate risk premium as the yield-to-maturity (FinancePy engine). Pair with a model that emits `climate_risk_premium` — e.g. Climate Damage Premium (DICE), downstream of Emissions Climate Projection (FaIR)."

run = "docker run --rm -v \"$PWD/run:/run\" ${IMAGE} ${ARGS} > run/bond_metrics.output.json"
image = "domokane/financepy:latest"
args = ["{input:damage_estimates}"]

[runner]
entrypoint = "runner.py"
language = "python"

[build]
dockerfile = "Dockerfile"

[resources]
memory = "4Gi"
cpu = "2"

[[inputs]]
name = "damage_estimates"
description = "Upstream economic / climate damage output containing a climate risk premium."

[inputs.schema]
type = "object"
# Tightened from the legacy Modelfile (which declared required = []): a
# climate bond price requires a yield source. climate_risk_premium is
# present in every DicePy run; adjusted_ytm and ytm are accepted but
# optional fall-throughs the runner also recognises.
required = ["climate_risk_premium"]
# An object, not a number: DicePy emits the premium per scenario/config as
# {scenario: {config: decimal_spread}}, which is what the runner consumes
# (_mean_nested collapses it to one scalar YTM). Declaring it as a number
# both mis-describes the runner and mismatches DicePy's declared output type.
# The `default` seeds the auto-generated "example to paste" with a premium of
# the order DicePy actually produces (~50 bps), so the example runs as-is.
properties.climate_risk_premium.type = "object"
properties.climate_risk_premium.description = "Decimal yield spread per scenario and config — {scenario: {config: float}}, as emitted by Climate Damage Premium (DICE). 0.005 = 50 bps."
properties.climate_risk_premium.default = { ramp = { central = 0.005 } }

[[outputs]]
name = "bond_metrics"

[outputs.schema]
type = "object"
required = ["clean_price", "dirty_price", "accrued_interest", "macauley_duration", "modified_duration", "convexity", "ytm"]
properties.clean_price.type = "number"
properties.dirty_price.type = "number"
properties.accrued_interest.type = "number"
properties.macauley_duration.type = "number"
properties.modified_duration.type = "number"
properties.convexity.type = "number"
properties.ytm.type = "number"
